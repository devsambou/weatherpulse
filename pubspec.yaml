name: weatherpulse_g16
description: "WeatherPulse - Application météo multi-villes - Groupe 16 - FlutterFire Summer Camp 2026"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Réseau / API
  http: ^1.2.0

  # Localisation GPS
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # State management
  flutter_riverpod: ^2.5.1

  # Injection de dépendances
  get_it: ^7.7.0

  # Gestion fonctionnelle des erreurs (Either<Failure, Success>)
  dartz: ^0.10.1

  # Cache local (feature bonus)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Vérification de connexion
  connectivity_plus: ^6.0.5

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4

  # Utilitaires
  intl: ^0.19.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true
