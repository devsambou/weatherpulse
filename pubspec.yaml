name: weatherpulse_g16
description: "WeatherPulse - Application météo multi-villes - Groupe 16 - FlutterFire Summer Camp 2026"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Réseau / API
  http: ^1.5.0

  # Localisation GPS
  geolocator: ^14.0.3
  geocoding: ^5.0.0

  # State management
  flutter_riverpod: ^3.4.3

  # Injection de dépendances
  get_it: ^9.2.1

  # Gestion fonctionnelle des erreurs (Either<Failure, Success>)
  dartz: ^0.10.1

  # Cache local (feature bonus)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Vérification de connexion
  connectivity_plus: ^7.3.1

  # Firebase
  firebase_core: ^4.14.0
  cloud_firestore: ^6.9.0

  # Utilitaires
  intl: ^0.20.3
  equatable: ^2.0.5

  # Variables d'environnement (clé API)
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  assets:
    - .env
